<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>Data Exporter — synthetic screenshot fixture</title>
<style>
html,body{margin:0;font:16px system-ui}body{padding:24px;background:#f4f5f7}body.dark{background:#111318}
ha-data-exporter{display:block;max-width:100%;--card-background-color:#fff;--primary-background-color:#f4f5f7}
body.dark ha-data-exporter{--card-background-color:#1c1e26;--primary-background-color:#111318}
.fixture-note{margin-bottom:16px}button{min-height:44px}
</style>
<p class="fixture-note">Synthetic demonstration data; no Home Assistant connection. <button id="advance">Update demonstration states</button></p>
<ha-data-exporter></ha-data-exporter>
<script src="../../ha-data-exporter.js"></script>
<script>
const params=new URLSearchParams(location.search),theme=params.get('theme')==='dark'?'dark':'light',language=params.get('lang')==='pl'?'pl':'en';
document.body.className=theme;document.documentElement.lang=language;
const card=document.querySelector('ha-data-exporter');card.style.width=(Number(params.get('width'))||900)+'px';
const states={
 'sensor.living_room_temperature':{state:'21.4',attributes:{friendly_name:'Living room temperature',unit_of_measurement:'°C'}},
 'sensor.living_room_humidity':{state:'48',attributes:{friendly_name:'Living room humidity',unit_of_measurement:'%'}},
 'sensor.house_power':{state:'0',attributes:{friendly_name:'House power',unit_of_measurement:'W'}},
 'sensor.outdoor_temperature':{state:'unavailable',attributes:{friendly_name:'Outdoor temperature'}},
 'light.living_room':{state:'on',attributes:{friendly_name:'Living room light'}}
};
const connection={connected:true};const hass=()=>({language,user:{id:'synthetic-screenshot-user',is_admin:true},connection,themes:{darkMode:theme==='dark'},states,callWS:async({type})=>type==='config/entity_registry/list'?Object.keys(states).map(entity_id=>({entity_id,device_id:'synthetic-device',area_id:null})):type==='config/device_registry/list'?[{id:'synthetic-device',name:'Demonstration device',area_id:'synthetic-area'}]:type==='config/area_registry/list'?[{area_id:'synthetic-area',name:'Demonstration area'}]:[]});
card.setConfig({type:'custom:ha-data-exporter',title:'Data Exporter',storage_key:'synthetic-screenshots-v4.2.0-'+theme+'-'+language,show_support:false,show_attributes:false,page_size:15});card.hass=hass();
document.getElementById('advance').onclick=()=>{states['sensor.house_power'].state='1240';states['sensor.outdoor_temperature'].state='unknown';states['sensor.new_measurement']={state:'0',attributes:{friendly_name:'New measurement'}};card.hass=hass();};
</script></html>
